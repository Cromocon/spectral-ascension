modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Range chiuso: l'API di Spectrum cambia tra versioni minori (vedi ricerca/06).
[[dependencies.${mod_id}]]
modId = "spectrum"
type = "required"
versionRange = "${spectrum_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "allthemodium"
type = "required"
versionRange = "${allthemodium_version_range}"
ordering = "AFTER"
side = "BOTH"

# Spectrum stesso richiede Curios (stessa versione minima): c'è sempre. Il mixin AzureDikeAttachmentTypeMixin usa CuriosApi.
[[dependencies.${mod_id}]]
modId = "curios"
type = "required"
versionRange = "${curios_version_range}"
ordering = "AFTER"
side = "BOTH"
